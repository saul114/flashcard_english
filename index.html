<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Inglés 500">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <title>Inglés Esencial 500 - Flashcards</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Phosphor Icons para estética nativa iOS -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            iosBlue: '#007aff',
            iosGreen: '#34c759',
            iosRed: '#ff3b30',
            iosOrange: '#ff9500',
            iosCardLight: '#ffffff',
            iosCardDark: '#1c1c1e',
            iosBgLight: '#f2f2f7',
            iosBgDark: '#000000',
          }
        }
      }
    }
  </script>

  <style>
    body {
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: pan-y;
    }

    /* Flip 3D de la tarjeta */
    .perspective-1000 {
      perspective: 1200px;
    }
    .card-inner {
      transform-style: preserve-3d;
      transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .card-inner.is-flipped {
      transform: rotateY(180deg);
    }
    .card-face {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .card-back {
      transform: rotateY(180deg);
    }

    /* Respeto de Safe Area en iPhone (notch, Dynamic Island y barra inferior) */
    .pt-safe { padding-top: max(env(safe-area-inset-top), 14px); }
    .pb-safe { padding-bottom: max(env(safe-area-inset-bottom), 14px); }

    /* Ocultar barra de scroll para navegación fluida de píldoras */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-[#f2f2f7] dark:bg-black text-[#1c1c1e] dark:text-[#f2f2f7] min-h-screen flex flex-col justify-between overflow-x-hidden">

  <!-- Header estilo iOS con controles rápidos -->
  <header class="pt-safe px-5 pb-3 sticky top-0 bg-[#f2f2f7]/85 dark:bg-black/85 backdrop-blur-md z-30 flex items-center justify-between border-b border-black/5 dark:border-white/10">
    <div>
      <div class="flex items-center gap-1.5">
        <span class="text-xs px-2 py-0.5 rounded-full bg-blue-500/10 text-iosBlue font-bold">500 TOP</span>
        <h1 class="text-xl font-bold tracking-tight">English Core</h1>
      </div>
      <p id="deck-progress-text" class="text-xs text-gray-500 dark:text-gray-400 font-medium">Cargando vocabulario...</p>
    </div>

    <div class="flex items-center gap-2">
      <!-- Selector de Modo: Flashcards / Quiz / Lista -->
      <div class="flex bg-gray-200/80 dark:bg-zinc-800 p-0.5 rounded-full text-xs font-semibold">
        <button id="nav-btn-cards" onclick="switchView('cards')" class="px-2.5 py-1 rounded-full bg-white dark:bg-zinc-700 text-iosBlue shadow-sm transition-all">
          <i class="ph ph-cards text-base"></i>
        </button>
        <button id="nav-btn-quiz" onclick="switchView('quiz')" class="px-2.5 py-1 rounded-full text-gray-500 dark:text-gray-400 transition-all">
          <i class="ph ph-exam text-base"></i>
        </button>
        <button id="nav-btn-list" onclick="switchView('list')" class="px-2.5 py-1 rounded-full text-gray-500 dark:text-gray-400 transition-all">
          <i class="ph ph-list-magnifying-glass text-base"></i>
        </button>
      </div>

      <!-- Botón Tema Oscuro / Claro -->
      <button onclick="toggleTheme()" class="w-8 h-8 rounded-full flex items-center justify-center bg-white dark:bg-zinc-800 shadow-sm border border-black/5 dark:border-white/10 active:scale-90 transition-transform text-gray-700 dark:text-gray-200">
        <i id="theme-icon" class="ph ph-moon text-base"></i>
      </button>
    </div>
  </header>

  <!-- Filtro de Categorías en píldoras horizontales -->
  <section class="px-4 py-2">
    <div id="category-pills" class="flex gap-1.5 overflow-x-auto no-scrollbar py-0.5 text-xs">
      <!-- Generado dinámicamente -->
    </div>
  </section>

  <!-- CONTENEDOR PRINCIPAL -->
  <main class="flex-1 flex flex-col justify-center px-4 max-w-md w-full mx-auto relative my-auto">

    <!-- VISTA 1: FLASHCARDS 3D -->
    <div id="view-cards" class="w-full flex flex-col items-center">
      
      <!-- Progreso superior del mazo -->
      <div class="w-full mb-3 flex items-center gap-3">
        <div class="flex-1 bg-gray-200 dark:bg-zinc-800 h-2 rounded-full overflow-hidden">
          <div id="progress-bar-fill" class="bg-iosBlue h-full w-0 transition-all duration-300"></div>
        </div>
        <span id="card-counter" class="text-xs font-semibold text-gray-400 tabular-nums">0/0</span>
      </div>

      <!-- Tarjeta Interactiva -->
      <div class="w-full perspective-1000 min-h-[360px] h-[52vh] max-h-[430px] relative cursor-pointer" id="swipe-area" onclick="flipCard()">
        <div id="flashcard" class="card-inner w-full h-full relative rounded-3xl shadow-xl transition-transform duration-500">
          
          <!-- ANVERSO (Inglés) -->
          <div class="card-face absolute inset-0 bg-white dark:bg-iosCardDark rounded-3xl p-6 flex flex-col justify-between border border-black/5 dark:border-white/10 shadow-sm">
            <div class="flex justify-between items-start">
              <span id="card-cat-badge" class="text-[11px] font-semibold tracking-wider uppercase px-2.5 py-1 rounded-full bg-blue-50 dark:bg-blue-950/60 text-iosBlue">Verbo</span>
              <div class="flex items-center gap-2">
                <span id="card-status-dot" class="w-2.5 h-2.5 rounded-full bg-gray-300"></span>
                <button onclick="event.stopPropagation(); speakWord();" class="w-10 h-10 rounded-full bg-blue-50 dark:bg-blue-950/50 text-iosBlue flex items-center justify-center active:scale-90 transition-transform">
                  <i class="ph ph-speaker-high text-xl"></i>
                </button>
              </div>
            </div>

            <div class="text-center my-auto px-2">
              <h2 id="card-english-word" class="text-4xl font-extrabold tracking-tight mb-2 text-gray-900 dark:text-white">...</h2>
              <p id="card-part-of-speech" class="text-xs uppercase font-bold tracking-widest text-gray-400"></p>
            </div>

            <div class="flex items-center justify-center gap-1.5 text-xs text-gray-400 font-medium">
              <i class="ph ph-hand-tap text-sm"></i> Toca para ver traducción en castellano
            </div>
          </div>

          <!-- REVERSO (Español) -->
          <div class="card-face card-back absolute inset-0 bg-white dark:bg-iosCardDark rounded-3xl p-6 flex flex-col justify-between border border-black/5 dark:border-white/10 shadow-sm">
            <div class="flex justify-between items-start">
              <span class="text-[11px] font-semibold tracking-wider uppercase px-2.5 py-1 rounded-full bg-emerald-50 dark:bg-emerald-950/50 text-emerald-600 dark:text-emerald-400">Español</span>
              <button onclick="event.stopPropagation(); speakWord();" class="w-10 h-10 rounded-full bg-gray-100 dark:bg-zinc-800 text-gray-600 dark:text-gray-300 flex items-center justify-center active:scale-90 transition-transform">
                <i class="ph ph-speaker-high text-xl"></i>
              </button>
            </div>

            <div class="text-center my-auto px-2">
              <h3 id="card-spanish-word" class="text-3xl font-extrabold text-gray-900 dark:text-white mb-2">...</h3>
              <p id="card-context-note" class="text-xs text-gray-500 dark:text-gray-400 italic max-w-xs mx-auto"></p>
            </div>

            <div class="flex items-center justify-center gap-1.5 text-xs text-gray-400 font-medium">
              <i class="ph ph-arrows-clockwise text-sm"></i> Toca para volver al inglés
            </div>
          </div>

        </div>
      </div>

      <!-- Botones de Acción (Repasar / Sabida) -->
      <div class="w-full grid grid-cols-2 gap-3 mt-5">
        <button onclick="markCurrentCard(false)" class="py-3 px-4 rounded-2xl bg-white dark:bg-iosCardDark border border-red-200 dark:border-red-900/40 text-iosRed font-semibold text-sm flex items-center justify-center gap-2 shadow-sm active:scale-95 transition-all">
          <i class="ph-bold ph-x text-base"></i>
          Repasar luego
        </button>
        <button onclick="markCurrentCard(true)" class="py-3 px-4 rounded-2xl bg-iosGreen text-white font-semibold text-sm flex items-center justify-center gap-2 shadow-sm active:scale-95 transition-all">
          <i class="ph-bold ph-check text-base"></i>
          Ya me la sé
        </button>
      </div>

      <!-- Navegación lateral y aleatorio -->
      <div class="flex items-center justify-between w-full mt-3 px-2">
        <button onclick="navigateCard(-1)" class="text-xs font-semibold text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 flex items-center gap-1 py-1">
          <i class="ph-bold ph-caret-left"></i> Anterior
        </button>
        <button onclick="shuffleDeck()" class="text-xs font-semibold text-iosBlue flex items-center gap-1 py-1">
          <i class="ph-bold ph-shuffle"></i> Barajar
        </button>
        <button onclick="navigateCard(1)" class="text-xs font-semibold text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 flex items-center gap-1 py-1">
          Siguiente <i class="ph-bold ph-caret-right"></i>
        </button>
      </div>

    </div>

    <!-- VISTA 2: QUIZ / TEST RÁPIDO DE 4 OPCIONES -->
    <div id="view-quiz" class="w-full hidden flex-col items-center">
      <div class="w-full bg-white dark:bg-iosCardDark rounded-3xl p-6 border border-black/5 dark:border-white/10 shadow-sm flex flex-col min-h-[370px] justify-between">
        <div class="flex justify-between items-center">
          <span class="text-xs font-bold text-iosBlue uppercase tracking-wider">Test de vocabulario</span>
          <button onclick="speakWord(document.getElementById('quiz-question').innerText)" class="w-8 h-8 rounded-full bg-blue-50 dark:bg-blue-950/40 text-iosBlue flex items-center justify-center">
            <i class="ph ph-speaker-high"></i>
          </button>
        </div>

        <div class="text-center my-4">
          <h2 id="quiz-question" class="text-3xl font-extrabold text-gray-900 dark:text-white mb-1">...</h2>
          <p class="text-xs text-gray-400">Selecciona la traducción correcta:</p>
        </div>

        <div id="quiz-options" class="grid grid-cols-1 gap-2.5">
          <!-- Opciones dinámicas -->
        </div>
      </div>

      <button onclick="nextQuizQuestion()" class="mt-4 text-xs font-semibold text-iosBlue flex items-center gap-1">
        Siguiente palabra <i class="ph-bold ph-arrow-right"></i>
      </button>
    </div>

    <!-- VISTA 3: BUSCADOR Y LISTA COMPLETA -->
    <div id="view-list" class="w-full hidden flex-col h-[65vh]">
      <!-- Input de búsqueda -->
      <div class="relative mb-3">
        <i class="ph ph-magnifying-glass absolute left-3.5 top-3 text-gray-400 text-base"></i>
        <input type="text" id="search-input" oninput="filterList()" placeholder="Buscar en inglés o español..." class="w-full bg-white dark:bg-iosCardDark text-sm rounded-2xl pl-10 pr-4 py-2.5 border border-black/5 dark:border-white/10 focus:outline-none focus:ring-2 focus:ring-iosBlue">
      </div>

      <!-- Lista con scroll -->
      <div id="words-list-container" class="flex-1 overflow-y-auto no-scrollbar space-y-1.5 pr-1">
        <!-- Rellenado dinámicamente -->
      </div>
    </div>

  </main>

  <!-- PANELL INFERIOR DE ESTADÍSTICAS PERSISTENTES -->
  <footer class="pb-safe px-5 pt-3 text-center text-xs text-gray-400 border-t border-black/5 dark:border-white/10 bg-[#f2f2f7]/85 dark:bg-black/85 backdrop-blur-md">
    <div class="flex justify-around items-center max-w-sm mx-auto mb-1">
      <div>
        <span id="stat-total" class="font-bold text-gray-700 dark:text-gray-200">500</span>
        <span class="block text-[10px]">Total</span>
      </div>
      <div>
        <span id="stat-learned" class="font-bold text-iosGreen">0</span>
        <span class="block text-[10px]">Dominadas</span>
      </div>
      <div>
        <span id="stat-review" class="font-bold text-iosRed">0</span>
        <span class="block text-[10px]">Por repasar</span>
      </div>
    </div>
  </footer>

      { id: 497, en: "couple", es: "par / pareja de personas", cat: "Números" },
      { id: 498, en: "total", es: "total", cat: "Números" },
      { id: 499, en: "zero", es: "cero", cat: "Números" },
      { id: 500, en: "piece", es: "trozo / pieza", cat: "Números" }
    ];

    /* ESTADO DE LA APLICACIÓN */
    let currentCategory = "Todas";
    let activeDeck = [];
    let currentIndex = 0;
    let isFlipped = false;
    let userProgress = JSON.parse(localStorage.getItem('english_500_progress') || '{}');
    let currentView = 'cards'; // 'cards' | 'quiz' | 'list'

    window.onload = function() {
      setupCategories();
      filterDeck("Todas");
      setupSwipeGestures();
      updateGlobalStats();
      buildWordsList();
    };

    /* Categorías */
    function setupCategories() {
      const categories = ["Todas", "Por repasar", "Aprendidas", "Verbos", "Sustantivos", "Adjetivos", "Conectores", "Números"];
      const container = document.getElementById("category-pills");
      container.innerHTML = "";

      categories.forEach(cat => {
        const btn = document.createElement("button");
        btn.innerText = cat;
        btn.className = `px-3.5 py-1.5 rounded-full whitespace-nowrap font-semibold transition-all ${
          cat === currentCategory 
            ? "bg-iosBlue text-white shadow-sm" 
            : "bg-white dark:bg-iosCardDark text-gray-600 dark:text-gray-300 border border-black/5 dark:border-white/10"
        }`;
        btn.onclick = () => filterDeck(cat);
        container.appendChild(btn);
      });
    }

    function filterDeck(cat) {
      currentCategory = cat;
      setupCategories();

      if (cat === "Todas") {
        activeDeck = [...ENGLISH_500];
      } else if (cat === "Por repasar") {
        activeDeck = ENGLISH_500.filter(item => userProgress[item.id] === false);
      } else if (cat === "Aprendidas") {
        activeDeck = ENGLISH_500.filter(item => userProgress[item.id] === true);
      } else {
        activeDeck = ENGLISH_500.filter(item => item.cat === cat);
      }

      if (activeDeck.length === 0) {
        activeDeck = [...ENGLISH_500]; // Fallback si no hay tarjetas en el filtro
      }

      currentIndex = 0;
      renderCurrentCard();
      if (currentView === 'quiz') renderQuizQuestion();
      if (currentView === 'list') buildWordsList();
    }

    /* Render de Tarjeta */
    function renderCurrentCard() {
      if (activeDeck.length === 0) return;
      const item = activeDeck[currentIndex];
      const cardEl = document.getElementById("flashcard");
      
      isFlipped = false;
      cardEl.classList.remove("is-flipped");

      document.getElementById("card-cat-badge").innerText = item.cat;
      document.getElementById("card-english-word").innerText = item.en;
      document.getElementById("card-part-of-speech").innerText = item.cat.slice(0, -1);
      document.getElementById("card-spanish-word").innerText = item.es;
      document.getElementById("card-context-note").innerText = `Frecuencia: Top ${item.id} de 500 palabras clave`;

      // Indicador de estado (aprendida / repasar / sin tocar)
      const dot = document.getElementById("card-status-dot");
      if (userProgress[item.id] === true) {
        dot.className = "w-2.5 h-2.5 rounded-full bg-iosGreen";
      } else if (userProgress[item.id] === false) {
        dot.className = "w-2.5 h-2.5 rounded-full bg-iosRed";
      } else {
        dot.className = "w-2.5 h-2.5 rounded-full bg-gray-300 dark:bg-gray-600";
      }

      // Progreso numérico
      const percent = ((currentIndex + 1) / activeDeck.length) * 100;
      document.getElementById("progress-bar-fill").style.width = `${percent}%`;
      document.getElementById("card-counter").innerText = `${currentIndex + 1}/${activeDeck.length}`;
      document.getElementById("deck-progress-text").innerText = `${activeDeck.length} palabras en "${currentCategory}"`;
    }

    function flipCard() {
      isFlipped = !isFlipped;
      document.getElementById("flashcard").classList.toggle("is-flipped", isFlipped);
    }

    function navigateCard(delta) {
      currentIndex += delta;
      if (currentIndex >= activeDeck.length) currentIndex = 0;
      if (currentIndex < 0) currentIndex = activeDeck.length - 1;
      renderCurrentCard();
    }

    function shuffleDeck() {
      activeDeck.sort(() => Math.random() - 0.5);
      currentIndex = 0;
      renderCurrentCard();
    }

    function markCurrentCard(isLearned) {
      const item = activeDeck[currentIndex];
      userProgress[item.id] = isLearned;
      localStorage.setItem('english_500_progress', JSON.stringify(userProgress));
      
      updateGlobalStats();
      navigateCard(1);
    }

    function updateGlobalStats() {
      const total = ENGLISH_500.length;
      let learned = 0;
      let review = 0;

      ENGLISH_500.forEach(item => {
        if (userProgress[item.id] === true) learned++;
        if (userProgress[item.id] === false) review++;
      });

      document.getElementById("stat-total").innerText = total;
      document.getElementById("stat-learned").innerText = learned;
      document.getElementById("stat-review").innerText = review;
    }

    /* Pronunciación Nativa (Web Speech API) */
    function speakWord(customWord) {
      if (!('speechSynthesis' in window)) return;
      const text = customWord || activeDeck[currentIndex].en;
      
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US'; // Inglés estándar
      utterance.rate = 0.9;
      window.speechSynthesis.speak(utterance);
    }

    /* Gestos Swipe */
    function setupSwipeGestures() {
      const area = document.getElementById("swipe-area");
      let startX = 0;
      let startY = 0;

      area.addEventListener("touchstart", (e) => {
        startX = e.changedTouches[0].screenX;
        startY = e.changedTouches[0].screenY;
      }, { passive: true });

      area.addEventListener("touchend", (e) => {
        const diffX = e.changedTouches[0].screenX - startX;
        const diffY = e.changedTouches[0].screenY - startY;

        if (Math.abs(diffX) > 40 && Math.abs(diffY) < 60) {
          if (diffX < 0) {
            navigateCard(1); // Swipe izquierda -> siguiente
          } else {
            navigateCard(-1); // Swipe derecha -> anterior
          }
        }
      }, { passive: true });
    }

    /* Navegación entre Vistas */
    function switchView(view) {
      currentView = view;
      const vCards = document.getElementById("view-cards");
      const vQuiz = document.getElementById("view-quiz");
      const vList = document.getElementById("view-list");

      const btnCards = document.getElementById("nav-btn-cards");
      const btnQuiz = document.getElementById("nav-btn-quiz");
      const btnList = document.getElementById("nav-btn-list");

      // Reset de botones
      [btnCards, btnQuiz, btnList].forEach(b => {
        b.className = "px-2.5 py-1 rounded-full text-gray-500 dark:text-gray-400 transition-all";
      });

      vCards.classList.add("hidden");
      vQuiz.classList.add("hidden");
      vList.classList.add("hidden");

      if (view === 'cards') {
        vCards.classList.remove("hidden");
        btnCards.className = "px-2.5 py-1 rounded-full bg-white dark:bg-zinc-700 text-iosBlue shadow-sm transition-all";
        renderCurrentCard();
      } else if (view === 'quiz') {
        vQuiz.classList.remove("hidden");
        vQuiz.classList.add("flex");
        btnQuiz.className = "px-2.5 py-1 rounded-full bg-white dark:bg-zinc-700 text-iosBlue shadow-sm transition-all";
        renderQuizQuestion();
      } else if (view === 'list') {
        vList.classList.remove("hidden");
        vList.classList.add("flex");
        btnList.className = "px-2.5 py-1 rounded-full bg-white dark:bg-zinc-700 text-iosBlue shadow-sm transition-all";
        buildWordsList();
      }
    }

    /* Lógica del Quiz */
    function renderQuizQuestion() {
      const current = activeDeck[currentIndex];
      document.getElementById("quiz-question").innerText = current.en;

      const distractors = ENGLISH_500
        .filter(item => item.id !== current.id)
        .sort(() => 0.5 - Math.random())
        .slice(0, 3)
        .map(item => item.es);

      const options = [...distractors, current.es].sort(() => 0.5 - Math.random());
      const container = document.getElementById("quiz-options");
      container.innerHTML = "";

      options.forEach(opt => {
        const btn = document.createElement("button");
        btn.innerText = opt;
        btn.className = "w-full text-left py-3 px-4 rounded-xl border border-black/10 dark:border-white/10 bg-gray-50 dark:bg-zinc-800 text-sm font-semibold transition-all active:scale-98";
        btn.onclick = () => checkQuiz(btn, opt === current.es);
        container.appendChild(btn);
      });
    }

    function checkQuiz(btn, isCorrect) {
      if (isCorrect) {
        btn.classList.remove("bg-gray-50", "dark:bg-zinc-800");
        btn.classList.add("bg-iosGreen", "text-white");
        markCurrentCard(true);
        setTimeout(() => nextQuizQuestion(), 600);
      } else {
        btn.classList.remove("bg-gray-50", "dark:bg-zinc-800");
        btn.classList.add("bg-iosRed", "text-white");
        markCurrentCard(false);
      }
    }

    function nextQuizQuestion() {
      navigateCard(1);
      renderQuizQuestion();
    }

    /* Lista y Buscador */
    function buildWordsList(filterText = "") {
      const listContainer = document.getElementById("words-list-container");
      listContainer.innerHTML = "";

      const query = filterText.toLowerCase().trim();
      const filtered = ENGLISH_500.filter(item => {
        const matchesCategory = currentCategory === "Todas" || item.cat === currentCategory;
        const matchesSearch = item.en.toLowerCase().includes(query) || item.es.toLowerCase().includes(query);
        return matchesCategory && matchesSearch;
      });

      if (filtered.length === 0) {
        listContainer.innerHTML = `<p class="text-center text-xs text-gray-400 py-8">No se encontraron palabras</p>`;
        return;
      }

      filtered.forEach(item => {
        const row = document.createElement("div");
        row.className = "flex items-center justify-between p-3 rounded-2xl bg-white dark:bg-iosCardDark border border-black/5 dark:border-white/10 text-xs";
        
        const isLearned = userProgress[item.id];
        const statusBadge = isLearned === true 
          ? `<span class="w-2 h-2 rounded-full bg-iosGreen"></span>` 
          : isLearned === false 
            ? `<span class="w-2 h-2 rounded-full bg-iosRed"></span>` 
            : `<span class="w-2 h-2 rounded-full bg-gray-300 dark:bg-zinc-600"></span>`;

        row.innerHTML = `
          <div class="flex items-center gap-3">
            ${statusBadge}
            <div>
              <span class="font-extrabold text-sm text-gray-900 dark:text-white">${item.en}</span>
              <span class="text-gray-400 text-[10px] ml-1.5">${item.cat}</span>
              <p class="text-gray-500 dark:text-gray-400 text-xs">${item.es}</p>
            </div>
          </div>
          <button onclick="speakWord('${item.en}')" class="w-8 h-8 rounded-full bg-gray-100 dark:bg-zinc-800 text-iosBlue flex items-center justify-center active:scale-90">
            <i class="ph ph-speaker-high"></i>
          </button>
        `;
        listContainer.appendChild(row);
      });
    }

    function filterList() {
      const query = document.getElementById("search-input").value;
      buildWordsList(query);
    }

    /* Tema Oscuro / Claro */
    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle('dark');
      const icon = document.getElementById('theme-icon');
      if (isDark) {
        icon.className = "ph ph-sun text-base text-amber-400";
      } else {
        icon.className = "ph ph-moon text-base text-gray-700";
      }
    }
  </script>
